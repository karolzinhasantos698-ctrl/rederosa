
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rede Rosa - Perfil</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        .perfil-body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff7fa, #ffe6ef);
            color: #30233c;
        }

        .perfil-header {
            min-height: 75px;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: #e86699;
            color: white;
        }

        .perfil-header h1 {
            margin: 0;
            font-size: clamp(20px, 3vw, 30px);
        }

        .voltar {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .perfil-container {
            width: min(100% - 32px, 1050px);
            margin: 35px auto;
        }

        .perfil-card {
            background: rgba(255, 255, 255, .94);
            padding: clamp(20px, 4vw, 40px);
            border: 1px solid #f7d5e2;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(190, 80, 125, .10);
        }

        .perfil-topo {
            text-align: center;
            margin-bottom: 28px;
        }

        .foto-perfil {
            width: 132px;
            height: 132px;
            margin: 0 auto 15px;
            position: relative;
            cursor: pointer;
        }

        .foto-perfil img,
        .inicial-perfil {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid white;
            outline: 2px solid #f6b6d0;
        }

        .foto-perfil img {
            display: none;
            object-fit: cover;
        }

        .inicial-perfil {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: #e86699;
            font-size: 56px;
            font-weight: 600;
        }

        .camera-perfil {
            position: absolute;
            right: -3px;
            bottom: 2px;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #e86699;
            background: white;
            border: 2px solid #f6b6d0;
        }

        .perfil-topo h2 {
            margin: 10px 0 4px;
            overflow-wrap: anywhere;
        }

        .perfil-topo p {
            color: #75677f;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .info {
            background: #fff1f6;
            padding: 10px 20px;
            border-radius: 14px;
            margin-bottom: 22px;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #f7d5e2;
            overflow-wrap: anywhere;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item span {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .editar-btn,
        .salvar-contato,
        .opcao-foto,
        .avatar-opcao {
            font: inherit;
            cursor: pointer;
            transition: .2s;
        }

        .editar-btn,
        .salvar-contato {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            font-weight: 600;
        }

        .editar-btn {
            background: #e86699;
            color: white;
            border: 1px solid #e86699;
            margin-top: 10px;
        }

        .editar-btn:hover,
        .salvar-contato:hover {
            background: #d94c83;
        }

        .sair-btn {
            background: white;
            color: #d94c83;
        }

        .sair-btn:hover {
            background: #fff1f6;
            color: #d94c83;
        }

        .editar-area,
        .personalizar-area {
            margin-top: 22px;
            padding: 20px;
            background: #fff8fb;
            border: 1px solid #f7d5e2;
            border-radius: 15px;
        }

        .editar-area h3,
        .personalizar-area h3 {
            margin-top: 0;
        }

        .campo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: white;
            border: 1px solid #e8d8e1;
            border-radius: 10px;
        }

        .campo i {
            color: #e86699;
        }

        .campo input {
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            font: inherit;
            background: transparent;
        }

        .salvar-contato {
            color: white;
            background: #e86699;
            border: none;
        }

        .opcoes-foto {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 15px;
        }

        .opcao-foto {
            padding: 22px 12px;
            color: #45354f;
            background: white;
            border: 1px solid #f3d3e0;
            border-radius: 14px;
        }

        .opcao-foto:hover {
            border-color: #e86699;
            background: #fff1f6;
        }

        .icone-opcao {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            margin: 0 auto 10px;
            color: white;
            background: #e86699;
            border-radius: 50%;
            font-size: 23px;
        }

        .opcao-foto strong,
        .opcao-foto small {
            display: block;
        }

        .opcao-foto small {
            margin-top: 6px;
            color: #75677f;
            line-height: 1.5;
        }

        .grade-avatares {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .avatar-opcao {
            width: 65px;
            height: 65px;
            max-width: 100%;
            justify-self: center;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 3px solid transparent;
            color: white;
            font-size: 30px;
        }

        .avatar-opcao.selecionado {
            border-color: #30233c;
            outline: 2px solid #e86699;
        }

        .avatar-opcao:hover {
            transform: scale(1.06);
        }

        .acao-secundaria {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            border: 1px solid #f0cbd9;
            border-radius: 10px;
            background: white;
            color: #d94c83;
            font: inherit;
            cursor: pointer;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            .perfil-header {
                padding: 14px 16px;
            }

            .perfil-container {
                width: calc(100% - 22px);
                margin: 18px auto;
            }

            .perfil-card {
                padding: 20px 15px;
            }

            .foto-perfil {
                width: 112px;
                height: 112px;
            }

            .inicial-perfil {
                font-size: 46px;
            }

            .info {
                padding: 8px 12px;
            }

            .info-item {
                align-items: flex-start;
                font-size: 13px;
            }

            .opcoes-foto {
                gap: 8px;
            }

            .opcao-foto {
                padding: 16px 8px;
                font-size: 13px;
            }

            .grade-avatares {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 10px;
            }

            .avatar-opcao {
                width: 54px;
                height: 54px;
                font-size: 25px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/refresh.css?v=perfil-20261027-2">
</head>

<body class="perfil-body rr-app">
    <a class="rr-skip" href="#conteudo">Pular para o conteúdo</a>

<header class="perfil-header">
<a class="rr-page-brand" href="home.html" aria-label="Rede Rosa — voltar ao início"><img class="rr-logo" src="assets/logo-rede-rosa-transparente.png" width="1238" height="1271" alt=""><span>Rede Rosa</span></a>
    <a href="home.html" class="voltar">← Voltar</a>
    <h1>Meu Perfil 🌸</h1>
    <span aria-hidden="true"></span>
</header>

<main id="conteudo" class="perfil-container">
    <section class="perfil-card">

        <div class="perfil-topo">
            <div
                class="foto-perfil"
                onclick="escolherFoto()"
                role="button"
                tabindex="0"
                aria-label="Alterar foto de perfil"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();escolherFoto()}">

                <div id="inicialPerfil" class="inicial-perfil">U</div>

                <img id="fotoPerfil" alt="Foto de perfil" />

                <span class="camera-perfil">
                    <i class="fa-solid fa-camera"></i>
                </span>
            </div>

            <h2 id="nomePerfil">Usuária</h2>
            <p id="emailPerfil">email@email.com</p>
        </div>

        <div class="info">
            <div class="info-item">
                <strong>👤 Nome:</strong>
                <span id="nomeInfo"></span>
            </div>

            <div class="info-item">
                <strong>📧 Email:</strong>
                <span id="emailInfo"></span>
            </div>
        </div>

        <button class="editar-btn" id="botaoEditarPerfil" type="button" aria-controls="editarArea" aria-expanded="false" onclick="editar()">
            <i class="fa-solid fa-pen"></i>
            Editar perfil
        </button>

        <form id="editarArea" class="editar-area" onsubmit="salvar(event)" hidden>
            <h3>✏️ Editar informações</h3>
            <label for="novoNome">Nome completo</label>

            <div class="campo">
                <i class="fa-solid fa-user"></i>
                <input id="novoNome" aria-label="Novo nome" placeholder="Novo nome"
                    autocomplete="name" maxlength="255" required>
            </div>

            <label for="novoEmail">E-mail</label>
            <div class="campo">
                <i class="fa-solid fa-envelope"></i>
                <input id="novoEmail" type="email"
                    aria-label="Novo email" placeholder="Novo email" autocomplete="email" maxlength="255" required>
            </div>

            <button class="salvar-contato" id="botaoSalvarPerfil" type="submit">
                💗 Salvar alterações
            </button>
            <button class="acao-secundaria" id="botaoCancelarPerfil" type="button" onclick="editar()">Cancelar edição</button>
        </form>
        <p id="statusPerfil" class="status-localizacao" role="status" aria-live="polite"></p>

        <section class="personalizar-area">
            <h3>🖼️ Personalizar foto de perfil</h3>
            <p>Escolha um avatar ou coloque sua própria foto.</p>

            <div class="opcoes-foto">
                <button class="opcao-foto" onclick="mostrarAvatares()">
                    <span class="icone-opcao">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </span>
                    <strong>Escolher avatar</strong>
                    <small>Opções prontas para você</small>
                </button>

                <button class="opcao-foto" onclick="escolherFoto()">
                    <span class="icone-opcao">
                        <i class="fa-solid fa-camera"></i>
                    </span>
                    <strong>Minha foto</strong>
                    <small>Usar uma imagem do dispositivo</small>
                </button>
            </div>

            <input
                type="file"
                id="arquivoFoto"
                accept="image/jpeg,image/png,image/webp,image/gif"
                hidden>

            <div id="areaAvatares" hidden>
                <h3>Escolha seu avatar</h3>
                <div id="gradeAvatares" class="grade-avatares"></div>

                <button class="acao-secundaria"
                    onclick="usarInicial()">
                    Usar inicial do meu nome
                </button>

                <button class="acao-secundaria"
                    onclick="fecharAvatares()">
                    Fechar
                </button>
            </div>

            <button class="acao-secundaria"
                onclick="removerPersonalizacao()">
                Restaurar inicial do nome
            </button>
        </section>

        <button class="editar-btn sair-btn" onclick="sair()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair da conta
        </button>

    </section>
</main>

<script src="js/usuario.js"></script>
<script>
    let usuario = {};
    let salvandoPerfil = false;
    let chavePerfil = "";
    let fotoTemporaria = null;

    const avatares = [
        { simbolo: "🌸", cor: "#e86699" },
        { simbolo: "🦋", cor: "#8b7cf6" },
        { simbolo: "🐱", cor: "#65a6f7" },
        { simbolo: "🐼", cor: "#69be91" },
        { simbolo: "🦄", cor: "#f4a54f" },
        { simbolo: "🐰", cor: "#55b8bd" },
        { simbolo: "🌷", cor: "#bd85ed" },
        { simbolo: "🐻", cor: "#f080aa" },
        { simbolo: "⭐", cor: "#edbd45" },
        { simbolo: "💗", cor: "#df6da8" }
    ];

    function obterChavePerfil(usuarioAtual) {
        // Cada conta recebe sua própria configuração.
        // O ID deve ser único para cada usuária.
        const identificador = usuarioAtual.id != null
            ? "id_" + usuarioAtual.id
            : usuarioAtual.email
                ? "email_" + usuarioAtual.email.trim().toLowerCase()
                : null;

        if (!identificador) {
            return null;
        }

        return "perfilPersonalizado:" + identificador;
    }

    function lerPersonalizacao() {
        if (!chavePerfil) return {};

        try {
            return JSON.parse(localStorage.getItem(chavePerfil)) || {};
        } catch (erro) {
            return {};
        }
    }

    function salvarPersonalizacao(dados) {
        if (!chavePerfil) {
            alert("Não foi possível identificar sua conta. Entre novamente.");
            return false;
        }

        try {
            localStorage.setItem(chavePerfil, JSON.stringify(dados));
            return true;
        } catch (erro) {
            alert("Não foi possível salvar. A imagem pode ser muito grande.");
            return false;
        }
    }

    function carregarUsuario() {
        usuario = RedeRosaUsuario.ler() || {};

        chavePerfil = obterChavePerfil(usuario);

        const nome = usuario.nome || "Usuária";
        const email = usuario.email || "email@email.com";

        document.getElementById("nomePerfil").textContent = nome;
        document.getElementById("emailPerfil").textContent = email;
        document.getElementById("nomeInfo").textContent = nome;
        document.getElementById("emailInfo").textContent = email;

        atualizarAvatar();
    }

    function atualizarAvatar() {
        const dados = lerPersonalizacao();
        const inicial = (usuario.nome || "U").trim().charAt(0).toUpperCase() || "U";

        const elementoInicial = document.getElementById("inicialPerfil");
        const imagem = document.getElementById("fotoPerfil");

        elementoInicial.textContent = inicial;
        elementoInicial.style.background = "#e86699";

        imagem.style.display = "none";
        imagem.removeAttribute("src");

        if (dados.tipo === "foto" && dados.valor) {
            imagem.src = dados.valor;
            imagem.style.display = "block";
            elementoInicial.style.display = "none";
        } else if (dados.tipo === "avatar") {
            elementoInicial.textContent = dados.valor;
            elementoInicial.style.background = dados.cor || "#e86699";
            elementoInicial.style.display = "flex";
        } else {
            elementoInicial.style.display = "flex";
        }

        desenharAvatares();
    }

    function mostrarStatusPerfil(mensagem, tipo) {
        const status = document.getElementById("statusPerfil");
        status.textContent = mensagem;
        status.className = "status-localizacao status-" + tipo;
    }

    function editar() {
        if (salvandoPerfil) return;
        const area = document.getElementById("editarArea");
        area.hidden = !area.hidden;
        document.getElementById("botaoEditarPerfil").setAttribute("aria-expanded", String(!area.hidden));
        if (!area.hidden) {
            document.getElementById("novoNome").value = usuario.nome || "";
            document.getElementById("novoEmail").value = usuario.email || "";
            mostrarStatusPerfil("", "info");
            document.getElementById("novoNome").focus();
        }
    }

    async function salvar(event) {
        if (event) event.preventDefault();
        if (salvandoPerfil) return;
        const novoNome = document.getElementById("novoNome").value.trim();
        const novoEmail = document.getElementById("novoEmail").value.trim();
        if (!novoNome || !novoEmail || novoNome.length > 255 || novoEmail.length > 255) {
            mostrarStatusPerfil("Preencha nome e e-mail com até 255 caracteres cada.", "erro");
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(novoEmail)) {
            mostrarStatusPerfil("Digite um e-mail válido.", "erro");
            return;
        }
        if (usuario.id == null) {
            mostrarStatusPerfil("Não foi possível identificar sua conta. Entre novamente para editar o perfil.", "erro");
            return;
        }
        const botao = document.getElementById("botaoSalvarPerfil");
        const textoBotao = botao.textContent;
        const controle = new AbortController();
        const timeout = setTimeout(() => controle.abort(), 15000);
        salvandoPerfil = true;
        botao.disabled = true;
        document.getElementById("botaoEditarPerfil").disabled = true;
        document.getElementById("botaoCancelarPerfil").disabled = true;
        botao.textContent = "Salvando…";
        mostrarStatusPerfil("Salvando suas informações…", "info");
        try {
            const resposta = await fetch("http://localhost:8080/usuarias/" + encodeURIComponent(usuario.id), {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                signal: controle.signal,
                body: JSON.stringify({ nome: novoNome, email: novoEmail })
            });
            const texto = await resposta.text();
            let dados = null;
            if (texto.trim()) {
                try { dados = JSON.parse(texto); } catch { /* Erros do servidor podem não ser JSON. */ }
            }
            if (!resposta.ok) {
                const mensagens = {
                    400: "Confira seu nome e e-mail e tente novamente.",
                    404: "Sua conta não foi encontrada. Entre novamente antes de editar.",
                    409: "Este e-mail já está sendo usado por outra conta."
                };
                throw new Error(dados?.mensagem || mensagens[resposta.status] || "O servidor não conseguiu salvar seu perfil. Tente novamente.");
            }
            const atualizado = RedeRosaUsuario.normalizar(dados);
            if (!atualizado || !atualizado.nome || typeof atualizado.email !== "string") {
                throw new Error("O servidor não confirmou a atualização. Entre novamente e tente salvar outra vez.");
            }
            usuario = { ...usuario, ...atualizado };
            try {
                localStorage.setItem("usuario", JSON.stringify(usuario));
            } catch {
                mostrarStatusPerfil("As alterações foram salvas no servidor, mas o navegador não conseguiu atualizar sua sessão. Entre novamente.", "erro");
                return;
            }
            carregarUsuario();
            document.getElementById("editarArea").hidden = true;
            document.getElementById("botaoEditarPerfil").setAttribute("aria-expanded", "false");
            mostrarStatusPerfil("Perfil atualizado com sucesso!", "sucesso");
        } catch (erro) {
            mostrarStatusPerfil(erro.name === "AbortError"
                ? "O servidor demorou para responder. Tente novamente."
                : erro instanceof TypeError
                    ? "Não foi possível conectar ao servidor. Confira se o backend está rodando e tente novamente."
                    : erro.message, "erro");
        } finally {
            clearTimeout(timeout);
            salvandoPerfil = false;
            botao.disabled = false;
            botao.textContent = textoBotao;
            document.getElementById("botaoEditarPerfil").disabled = false;
            document.getElementById("botaoCancelarPerfil").disabled = false;
        }
    }

    function escolherFoto() {
        document.getElementById("arquivoFoto").click();
    }

    document.getElementById("arquivoFoto").addEventListener("change", function(event) {
        const arquivo = event.target.files[0];

        if (!arquivo) return;

        if (!arquivo.type.startsWith("image/")) {
            alert("Selecione um arquivo de imagem válido.");
            event.target.value = "";
            return;
        }

        if (arquivo.size > 5 * 1024 * 1024) {
            alert("Escolha uma imagem de até 5 MB.");
            event.target.value = "";
            return;
        }

        const leitor = new FileReader();

        leitor.onload = function(e) {
            fotoTemporaria = e.target.result;

            if (salvarPersonalizacao({
                tipo: "foto",
                valor: fotoTemporaria
            })) {
                atualizarAvatar();
                alert("Foto atualizada 🌸");
            }

            event.target.value = "";
        };

        leitor.onerror = function() {
            alert("Não foi possível ler essa imagem.");
        };

        leitor.readAsDataURL(arquivo);
    });

    function mostrarAvatares() {
        document.getElementById("areaAvatares").hidden = false;
        desenharAvatares();
    }

    function fecharAvatares() {
        document.getElementById("areaAvatares").hidden = true;
    }

    function desenharAvatares() {
        const grade = document.getElementById("gradeAvatares");
        if (!grade) return;

        const dados = lerPersonalizacao();
        grade.replaceChildren();

        avatares.forEach(function(avatar) {
            const botao = document.createElement("button");

            botao.type = "button";
            botao.className = "avatar-opcao";
            botao.textContent = avatar.simbolo;
            botao.style.backgroundColor = avatar.cor;
            botao.setAttribute("aria-label", "Avatar " + avatar.simbolo);

            if (dados.tipo === "avatar" &&
                dados.valor === avatar.simbolo &&
                dados.cor === avatar.cor) {
                botao.classList.add("selecionado");
            }

            botao.addEventListener("click", function() {
                if (salvarPersonalizacao({
                    tipo: "avatar",
                    valor: avatar.simbolo,
                    cor: avatar.cor
                })) {
                    atualizarAvatar();
                    fecharAvatares();
                }
            });

            grade.appendChild(botao);
        });
    }

    function usarInicial() {
        if (salvarPersonalizacao({ tipo: "inicial" })) {
            atualizarAvatar();
            fecharAvatares();
        }
    }

    function removerPersonalizacao() {
        if (!chavePerfil) {
            alert("Entre em uma conta para alterar o perfil.");
            return;
        }

        if (confirm("Deseja voltar a usar a inicial do seu nome?")) {
            usarInicial();
        }
    }

    function sair() {
        localStorage.removeItem("usuario");
        window.location.href = "index.html";
    }

    carregarUsuario();
</script>

</body>
</html>
