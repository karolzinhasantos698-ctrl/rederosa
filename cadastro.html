<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rede Rosa - Cadastro</title>


<link rel="stylesheet" href="css/style.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="css/refresh.css">
</head>


<body class="cadastro-body rr-app">



<div class="cadastro-container">



<div class="cadastro-logo rr-auth-brand"><img class="rr-logo" src="assets/logo-rede-rosa-transparente.png" width="1238" height="1271" alt="Rede Rosa — apoio, proteção e empoderamento"></div>





<div class="cadastro-box">


<h2>Criar conta</h2>


<p>
Cadastre-se para entrar na Rede Rosa
</p>





<form onsubmit="cadastrar(event)">





<input

id="nome"

class="cadastro-input"

type="text"

aria-label="Nome completo" placeholder="Nome completo"

required>





<input

id="email"

class="cadastro-input"

type="email"

aria-label="E-mail" placeholder="E-mail"

required>





<input

id="senha"

class="cadastro-input"

type="password"

aria-label="Senha" placeholder="Senha"

required>





<input

id="confirmar"

class="cadastro-input"

type="password"

aria-label="Confirmar senha" placeholder="Confirmar senha"

required>





<button 
type="submit"
class="cadastro-btn">

Criar conta 🌸

</button>





</form>






<div class="cadastro-links">


<a href="index.html">

Já tenho uma conta

</a>


</div>




</div>






<div class="cadastro-footer">

Apoio • Proteção • Empoderamento 💗

</div>




</div>










<script src="js/api.js"></script>

<script>

async function cadastrar(event) {

    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    const botao = event.target.querySelector('button[type="submit"]');

    if (senha !== confirmar) {
        alert("As senhas não são iguais!");
        return;
    }

    if (!nome || !email || !senha) {
        alert("Preencha todos os campos!");
        return;
    }

    if (botao.disabled) return;

    botao.disabled = true;
    botao.textContent = "Cadastrando...";

    try {

        await RedeRosaAPI.request("/usuarias/cadastro", {
            method: "POST",
            autenticada: false,
            body: {
                nome: nome,
                email: email,
                senha: senha
            }
        });

        alert("Cadastro realizado com sucesso 🌸");

        window.location.href = "index.html";

    } catch (erro) {

        alert(erro.message);

    } finally {

        botao.disabled = false;
        botao.textContent = "Criar conta 🌸";

    }
}

</script>

</body>

</html>
