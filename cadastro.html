<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rede Rosa - Cadastro</title>


<link rel="stylesheet" href="css/style.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="css/refresh.css">
</head>


<body class="cadastro-body rr-app">



<div class="cadastro-container">



<div class="cadastro-logo rr-auth-brand"><img class="rr-logo" src="assets/logo-rede-rosa-transparente.png" width="1238" height="1271" alt="Rede Rosa — apoio, proteção e empoderamento"></div>





<div class="cadastro-box">


<h2>Criar conta</h2>


<p>
Cadastre-se para entrar na Rede Rosa
</p>





<form onsubmit="cadastrar(event)">





<input

id="nome"

class="cadastro-input"

type="text"

aria-label="Nome completo" placeholder="Nome completo"

required>





<input

id="email"

class="cadastro-input"

type="email"

aria-label="E-mail" placeholder="E-mail"

required>





<input

id="senha"

class="cadastro-input"

type="password"

aria-label="Senha" placeholder="Senha"

required>





<input

id="confirmar"

class="cadastro-input"

type="password"

aria-label="Confirmar senha" placeholder="Confirmar senha"

required>





<button 
type="submit"
class="cadastro-btn">

Criar conta 🌸

</button>





</form>






<div class="cadastro-links">


<a href="index.html">

Já tenho uma conta

</a>


</div>




</div>






<div class="cadastro-footer">

Apoio • Proteção • Empoderamento 💗

</div>




</div>









<script>



function cadastrar(event){


event.preventDefault();





let nome =
document.getElementById("nome").value;



let email =
document.getElementById("email").value;



let senha =
document.getElementById("senha").value;



let confirmar =
document.getElementById("confirmar").value;






if(senha !== confirmar){

alert("As senhas não são iguais");

return;

}







fetch("http://localhost:8080/usuarias/cadastro", {



method:"POST",



headers:{


"Content-Type":"application/json"


},




body:JSON.stringify({


nome:nome,

email:email,

senha:senha


})



})



.then(response=>{


if(!response.ok){

throw new Error("Erro no cadastro");

}


return response.json();


})



.then(data=>{


alert("Cadastro realizado com sucesso 🌸");



document.querySelector("form").reset();



console.log(data);



})



.catch(error=>{


console.log(error);


alert("Não foi possível cadastrar");


});



}





</script>





</body>

</html>
